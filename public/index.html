<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>User Management Dashboard</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-slate-50 min-h-screen py-10 px-4 sm:px-6 lg:px-8">
    <div class="max-w-4xl mx-auto">
        <!-- Header -->
        <div class="text-center mb-10">
            <h1 class="text-4xl font-extrabold text-slate-900 tracking-tight">User Management</h1>
            <p class="mt-2 text-sm text-slate-600">Simple CRUD application built with Node.js, Express, and MySQL test</p>
        </div>

        <div class="grid grid-cols-1 md:grid-cols-3 gap-8">
            <!-- Form Card -->
            <div class="bg-white p-6 rounded-2xl shadow-sm border border-slate-200 md:col-span-1">
                <h2 id="form-title" class="text-lg font-semibold text-slate-800 mb-4">Add New User</h2>
                <form id="user-form" class="space-y-4">
                    <input type="hidden" id="userID">
                    <div>
                        <label class="block text-xs font-medium text-slate-500 uppercase mb-1">Name</label>
                        <input type="text" id="name" required class="w-full px-3 py-2 border border-slate-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-indigo-500 text-sm">
                    </div>
                    <div>
                        <label class="block text-xs font-medium text-slate-500 uppercase mb-1">Age</label>
                        <input type="number" id="age" required class="w-full px-3 py-2 border border-slate-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-indigo-500 text-sm">
                    </div>
                    <div class="flex gap-2 pt-2">
                        <button type="submit" id="save-btn" class="flex-1 bg-indigo-600 hover:bg-indigo-700 text-white font-medium py-2 rounded-lg text-sm transition shadow-sm">Save</button>
                        <button type="button" id="cancel-btn" onclick="resetForm()" class="hidden bg-slate-200 hover:bg-slate-300 text-slate-700 font-medium px-4 py-2 rounded-lg text-sm transition">Cancel</button>
                    </div>
                </form>
            </div>

            <!-- Table Card -->
            <div class="bg-white rounded-2xl shadow-sm border border-slate-200 md:col-span-2 overflow-hidden flex flex-col">
                <div class="p-6 border-b border-slate-100">
                    <h2 class="text-lg font-semibold text-slate-800">Users Directory</h2>
                </div>
                <div class="overflow-x-auto flex-1">
                    <table class="w-full text-left border-collapse text-sm">
                        <thead>
                            <tr class="bg-slate-50 text-slate-400 font-medium border-b border-slate-100">
                                <th class="py-3 px-6">ID</th>
                                <th class="py-3 px-6">Name</th>
                                <th class="py-3 px-6">Age</th>
                                <th class="py-3 px-6 text-right">Actions</th>
                            </tr>
                        </thead>
                        <tbody id="user-table-body" class="divide-y divide-slate-100 text-slate-700">
                            <!-- Populated by JS -->
                        </tbody>
                    </table>
                </div>
            </div>
        </div>
    </div>

    <script>
        const API_URL = '/api/users';
        const form = document.getElementById('user-form');
        const tableBody = document.getElementById('user-table-body');
        const formTitle = document.getElementById('form-title');
        const saveBtn = document.getElementById('save-btn');
        const cancelBtn = document.getElementById('cancel-btn');
        const userIdInput = document.getElementById('userID');
        const nameInput = document.getElementById('name');
        const ageInput = document.getElementById('age');

        async function fetchUsers() {
            try {
                const res = await fetch(API_URL);
                const users = await res.json();
                tableBody.innerHTML = users.length ? '' : `<tr><td colspan="4" class="py-6 text-center text-slate-400">No users found.</td></tr>`;
                
                users.forEach(user => {
                    tableBody.innerHTML += `
                        <tr class="hover:bg-slate-50/50 transition">
                            <td class="py-3 px-6 font-medium text-slate-900">${user.userID}</td>
                            <td class="py-3 px-6">${user.name}</td>
                            <td class="py-3 px-6">${user.age}</td>
                            <td class="py-3 px-6 text-right space-x-2">
                                <button onclick="editUser(${user.userID}, '${user.name}', ${user.age})" class="text-indigo-600 hover:text-indigo-900 font-medium">Edit</button>
                                <button onclick="deleteUser(${user.userID})" class="text-rose-600 hover:text-rose-900 font-medium">Delete</button>
                            </td>
                        </tr>
                    `;
                });
            } catch (err) {
                console.error('Error fetching users:', err);
            }
        }

        form.addEventListener('submit', async (e) => {
            e.preventDefault();
            const id = userIdInput.value;
            const data = { name: nameInput.value, age: ageInput.value };

            try {
                if (id) {
                    await fetch(`${API_URL}/${id}`, {
                        method: 'PUT',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify(data)
                    });
                } else {
                    await fetch(API_URL, {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify(data)
                    });
                }
                resetForm();
                fetchUsers();
            } catch (err) {
                console.error('Error saving user:', err);
            }
        });

        function editUser(id, name, age) {
            userIdInput.value = id;
            nameInput.value = name;
            ageInput.value = age;
            formTitle.textContent = 'Edit User';
            saveBtn.textContent = 'Update';
            saveBtn.className = 'flex-1 bg-emerald-600 hover:bg-emerald-700 text-white font-medium py-2 rounded-lg text-sm transition shadow-sm';
            cancelBtn.classList.remove('hidden');
        }

        async function deleteUser(id) {
            if (confirm('Are you sure you want to delete this user?')) {
                try {
                    await fetch(`${API_URL}/${id}`, { method: 'DELETE' });
                    fetchUsers();
                } catch (err) {
                    console.error('Error deleting user:', err);
                }
            }
        }

        function resetForm() {
            form.reset();
            userIdInput.value = '';
            formTitle.textContent = 'Add New User';
            saveBtn.textContent = 'Save';
            saveBtn.className = 'flex-1 bg-indigo-600 hover:bg-indigo-700 text-white font-medium py-2 rounded-lg text-sm transition shadow-sm';
            cancelBtn.classList.add('hidden');
        }

        fetchUsers();
    </script>
</body>
</html>
